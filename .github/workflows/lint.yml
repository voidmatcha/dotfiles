name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38
        env:
          SHELLCHECK_OPTS: -e SC1091 -x
        with:
          version: v0.11.0
          severity: warning
          scandir: '.'
          ignore_names: .zshrc

  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n on every shell script
        run: |
          set -e
          find . -type f \( -name '*.sh' -o -name 'install.sh' \) \
            -not -path './.git/*' \
            -not -path './node_modules/*' \
            -print0 | xargs -0 -I{} bash -n {}

  json-config-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON configs
        run: |
          set -euo pipefail
          python3 -m json.tool configs/claude-settings.json > /dev/null
          python3 -m json.tool configs/mcp.json > /dev/null
          python3 -m json.tool configs/opencode/opencode.json > /dev/null
          python3 -m json.tool configs/opencode/oh-my-openagent.json > /dev/null

  toml-config-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate TOML configs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tomllib
          from pathlib import Path

          tomllib.loads(Path('configs/codex/config.toml').read_text())
          PY

  brewfile-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Brewfile parses with brew bundle
        run: |
          # `brew bundle list` walks the Brewfile through Homebrew's own parser
          # (which knows about the `tap`/`brew`/`cask`/`mas`/`vscode` DSL methods).
          # Plain `ruby -e "eval(...)"` does NOT, because those methods are only
          # defined inside the Homebrew bundler context.
          brew bundle list --file=Brewfile > /dev/null

  bats:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats-core
        run: brew install bats-core
      - name: Run bats suite
        run: bats tests/
