# Top-level settings (must be before any [table])
model_reasoning_effort = "medium"
suppress_unstable_features_warning = true
developer_instructions = "AGENTS.md is the main control surface. Follow its scope, routing, and verification rules. Keep progress outcome-first and concise. Use native subagents only for bounded independent work that materially improves speed or correctness."
model_context_window = 250000
model_auto_compact_token_limit = 200000

# Codex CLI configuration (~/.codex/config.toml).
# Copied to ~/.codex/config.toml by scripts/codex.sh; Codex mutates its live
# config with machine-local trust/runtime entries, so this tracked file stays
# a portable template instead of a symlink target.
# Reference for token-saving checklist:
# https://gist.github.com/spilist/c468cbf1ed0ffc91100f813aabdcd520
# (each setting below is verified against the official Codex docs linked inline.)

model = "gpt-5.6-sol"
# Leave model_provider unset so Codex uses its OpenAI default.
approval_policy = "on-request"
sandbox_mode = "workspace-write"

# ── Token saving ──

# Web search mode: "disabled" | "cached" | "live" (default: "cached").
# Disable to drop the web_search tool definition from every system prompt.
# Re-enable per-invocation with `codex --search` when actually needed.
# Source: https://developers.openai.com/codex/config-reference
web_search = "disabled"

[features]
# Disable ChatGPT-connected apps/connectors. Drops connector tool definitions
# from the system prompt. Re-enable if you use ChatGPT connectors from Codex.
# Source: https://developers.openai.com/codex/config-reference (features.apps)
apps = false

# ── Feature enablement (not token saving) ──

# Experimental `/goal` slash command — durable objective for long-running work
# (migrations, refactors, eval loops). Independent of the token-saving above.
# Source: https://developers.openai.com/codex/use-cases/follow-goals
goals = true

# Built-in Codex Memories. Keeps cross-session recall local under ~/.codex/memories.
# External-context sessions stay out of memory generation to avoid persisting
# hosted MCP/web/tool-search material.
# Source: https://developers.openai.com/codex/memories
memories = true

multi_agent = true
child_agents_md = true
hooks = true

[memories]
generate_memories = true
use_memories = true
disable_on_external_context = true
min_rate_limit_remaining_percent = 20
[profiles.yolo]
approval_policy = "never"
sandbox_mode = "danger-full-access"

# serena — LSP-backed semantic code navigation + editing (cross-file rename,
# symbol-aware edits). Personal/user scope; not in NAVER MCP catalog.
# `--open-web-dashboard false` keeps the dashboard server reachable at
# http://localhost:24282/dashboard/ but prevents auto-launch in browser.
[mcp_servers.serena]
command = "serena"
args = [
  "start-mcp-server",
  "--context", "codex",
  "--project-from-cwd",
  "--open-web-dashboard", "false",
]
startup_timeout_sec = 60

# codegraph — pre-indexed code knowledge graph for exploration / trace /
# architecture questions on large repos. Read-only; complements serena.
# Run `codegraph init -i` once per project.
[mcp_servers.codegraph]
command = "codegraph"
args = ["serve", "--mcp"]
startup_timeout_sec = 15

# context7 — version-aware library/framework docs lookup. HTTP MCP endpoint,
# anonymous by default; use only when current official docs matter.
[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
startup_timeout_sec = 15

# OpenAI Docs — official docs MCP used by the openai-docs Codex skill.
[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
startup_timeout_sec = 15

# Figma hosted — personal/default Codex design-context path.
# Company overlay disables this hosted server by default and uses company
# figma-developer-mcp instead. Authenticate once per machine with:
# codex mcp login figma
[mcp_servers.figma]
url = "https://mcp.figma.com/mcp"
startup_timeout_sec = 15
tool_timeout_sec = 120

# Figma Desktop — local-only fallback when hosted Figma is inappropriate.
# Enable manually after turning on the MCP server in the Figma desktop app.
[mcp_servers.figma-desktop]
url = "http://127.0.0.1:3845/mcp"
enabled = false
startup_timeout_sec = 5
tool_timeout_sec = 120

# Official Zeplin MCP. The repo auth profile maps the selected personal/work
# Keychain entry to ZEPLIN_ACCESS_TOKEN. Keep disabled until the project needs
# Zeplin so an absent token does not create startup noise.
[mcp_servers.zeplin]
command = "npx"
args = ["-y", "@zeplin/mcp-server@1.0.6"]
enabled = false
startup_timeout_sec = 30
tool_timeout_sec = 120

# Official Atlassian Rovo MCP profiles for Jira and Confluence. Keep every
# identity disabled globally and enable only one matching profile per project.
# Each environment variable contains the complete Authorization header value
# (for example, "Basic ..." or "Bearer ..."). The token's scopes enforce the
# read/write boundary; the profile name alone does not grant it.
[mcp_servers.atlassian-personal-ro]
url = "https://mcp.atlassian.com/v1/mcp"
enabled = false
env_http_headers = { Authorization = "ATLASSIAN_PERSONAL_RO_AUTH" }
startup_timeout_sec = 15
tool_timeout_sec = 120

[mcp_servers.atlassian-work-ro]
url = "https://mcp.atlassian.com/v1/mcp"
enabled = false
env_http_headers = { Authorization = "ATLASSIAN_WORK_RO_AUTH" }
startup_timeout_sec = 15
tool_timeout_sec = 120

[mcp_servers.atlassian-work-rw]
url = "https://mcp.atlassian.com/v1/mcp"
enabled = false
env_http_headers = { Authorization = "ATLASSIAN_WORK_RW_AUTH" }
startup_timeout_sec = 15
tool_timeout_sec = 120

# Local translation Worker from the korean-tech-humanizer repo. This template is
# copied verbatim to every machine, so it cannot carry a checkout path. It calls
# a launcher by name instead; the repo's `pnpm setup:local` installs that
# launcher into ~/.local/bin pointing at its own checkout. On machines without
# the repo there is no launcher, so this server shows up as failed — the enabled
# state belongs to this template and cannot be split per machine.
# The Worker must be running for this to actually connect:
# pnpm --filter @translation-mcp/server dev
[mcp_servers.translation-mcp]
command = "translation-mcp-bridge"
enabled = true
startup_timeout_sec = 15

[agents]
max_threads = 6
max_depth = 2

# Codex CLI v0.101.0+ built-in status line.
[tui]
status_line = ["model-with-reasoning", "git-branch", "context-remaining", "total-input-tokens", "total-output-tokens", "five-hour-limit", "weekly-limit"]
terminal_title = ["project-name", "git-branch"]
